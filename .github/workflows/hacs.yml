name: HACS validate

on:
  workflow_dispatch:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"

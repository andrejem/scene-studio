<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232846"/>
      <stop offset="1" stop-color="#0f1226"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.75" stop-color="#ff7a2f"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="pink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6ad5"/>
      <stop offset="0.75" stop-color="#e0218a"/>
      <stop offset="1" stop-color="#c2127a" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="cyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7ef0ff"/>
      <stop offset="0.75" stop-color="#1fb6ff"/>
      <stop offset="1" stop-color="#1287e0" stop-opacity="0.85"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <g filter="url(#glow)" opacity="0.55">
    <circle cx="256" cy="200" r="104" fill="#ff8a3a"/>
    <circle cx="200" cy="300" r="104" fill="#e0218a"/>
    <circle cx="312" cy="300" r="104" fill="#1fb6ff"/>
  </g>
  <g style="mix-blend-mode:screen; isolation:isolate">
    <circle cx="256" cy="200" r="100" fill="url(#warm)" style="mix-blend-mode:screen"/>
    <circle cx="200" cy="298" r="100" fill="url(#pink)" style="mix-blend-mode:screen"/>
    <circle cx="312" cy="298" r="100" fill="url(#cyan)" style="mix-blend-mode:screen"/>
  </g>
</svg>

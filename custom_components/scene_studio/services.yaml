delete_saved_scene:
  name: "Delete saved scene"
  description: Delete a saved scene and its scene entity
  fields:
    id:
      name: ID
      description: "ID of the saved scene"
      required: true
      selector:
        text: null

activate_saved_scene:
  name: "Activate saved scene"
  description: Activate a saved scene (same as turning on its scene entity)
  fields:
    id:
      name: ID
      description: "ID of the saved scene"
      required: true
      selector:
        text: null
    dynamic:
      name: "Dynamic"
      description: "Optional. Override the saved mode: off applies a dynamic scene once (static), on starts a static scene as dynamic scene"
      selector:
        boolean:
    targets:
      name: "Targets"
      description: "Optional. Apply the saved scene to these lights instead of its own targets (exclude, keep_groups and optional are ignored then). The lights leave running dynamic scenes, the rest of those scenes keeps going."
      selector:
        target:
          entity:
            domain: light

import_scene_presets:
  name: Import from Scene Presets
  description: >-
    Brings saved scenes, own presets and replaced pictures over from the Scene Presets integration.
    Scenes that were imported before are skipped.
  fields:
    take_over_entities:
      name: Take over scene entities
      description: >-
        Keep entity ID, name, area and labels of the scene entities, so dashboards and automations keep
        working. Scene Presets is disabled for that (not removed).
      default: true
      selector:
        boolean:
    overwrite:
      name: Overwrite
      description: Import scenes and files again even if they exist already.
      default: false
      selector:
        boolean:
